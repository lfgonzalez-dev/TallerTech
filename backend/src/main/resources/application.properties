spring.application.name=tallertech-backend
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.bootstrap.name=${BOOTSTRAP_ADMIN_NAME:}
app.bootstrap.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.role=${BOOTSTRAP_ADMIN_ROLE:}
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/tallertech}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never

